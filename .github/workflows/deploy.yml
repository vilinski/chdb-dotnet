name: publish dotnet packages

on:
  release:
    types: [ created ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x
          cache: true
      - name: Download chdb libraries for all platforms
        run: |
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-arm64; do
            ./update_libchdb.sh "" "$platform"
          done
      - run: dotnet build --configuration Release
      - name: Create the packages
        run: |
          dotnet pack src/chdb/chdb.csproj --configuration Release --include-symbols
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dotnet pack src/chdb-runtime/chdb-runtime.csproj --configuration Release -p:RID=$rid
          done
          dotnet pack src/chdb-tool/chdb-tool.csproj --configuration Release --include-symbols
      - name: Publish the package to nuget.org
        run: dotnet nuget push nupkg/*.nupkg -k $NUGET_AUTH_TOKEN -s https://api.nuget.org/v3/index.json
        env:
          NUGET_AUTH_TOKEN: ${{secrets.NUGET_TOKEN}}
